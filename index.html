<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eef3fb">
<title>Taher Shajapurwala — Khidmat Portfolio | Idarah, Since 2015</title>
<meta name="description" content="Record of khidmat at Idarah and Talabulilm since 2015 across web development, design, video, social media, AI automation, QA, data analysis and printing.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* Light theme base */
    --bg: #eef3fb;
    --bg2: #ffffff;
    --ink: #141334;          /* primary text */
    --ink-soft: #3d3f63;     /* body text */

    /* Bright accents, darkened just enough to stay readable on white */
    --cyan: #0099b8;
    --emerald: #04916a;
    --violet: #7c3aed;
    --rose: #e01b6f;
    --amber: #d98300;
    --blue: #2563eb;
    --indigo: #4f46e5;
    --lime: #5a9e00;
    --orange: #ea5c0c;
    --slate: #5d6180;

    --card-surface: rgba(255, 255, 255, 0.74);
    --border: rgba(20, 19, 52, 0.10);
  }

  html {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
  }

  body {
    position: fixed;          /* stops iOS rubber-banding the whole page */
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;           /* keeps full height as mobile browser bars show/hide */
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  /* ── Animated Background (light) ── */
  .bg-animated {
    position: fixed; inset: 0; z-index: -3;
    background: linear-gradient(130deg, #eef3fb, #e5f6fb, #f3e9ff, #ffe9f2, #eaf0ff, #e8fbf2, #eef3fb);
    background-size: 400% 400%;
    animation: bgShift 24s ease infinite;
  }
  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .bg-blobs { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; }
  .blob {
    position: absolute; border-radius: 50%;
    filter: blur(90px); opacity: 0.4;
    mix-blend-mode: multiply;
  }
  .blob.b1 { width: 480px; height: 480px; background: #9fe8f5; top: -120px; left: -100px; animation: blobA 18s ease-in-out infinite; }
  .blob.b2 { width: 420px; height: 420px; background: #ffc2dc; bottom: -140px; right: -80px; animation: blobB 22s ease-in-out infinite; }
  .blob.b3 { width: 360px; height: 360px; background: #d7f5a8; top: 45%; left: 55%; animation: blobC 16s ease-in-out infinite; }
  .blob.b4 { width: 300px; height: 300px; background: #ffe6a3; top: 10%; right: 12%; animation: blobA 20s ease-in-out infinite reverse; }

  @keyframes blobA {
    0%,100% { transform: translate(0,0) scale(1); }
    33%  { transform: translate(180px, 120px) scale(1.25); }
    66%  { transform: translate(60px, 260px) scale(0.85); }
  }
  @keyframes blobB {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-220px, -160px) scale(1.35); }
  }
  @keyframes blobC {
    0%,100% { transform: translate(-50%,-50%) scale(1); }
    40% { transform: translate(-80%,-30%) scale(1.3); }
    70% { transform: translate(-20%,-70%) scale(0.9); }
  }

  /* ── Animated grid sweep ── */
  .bg-grid {
    position: fixed; inset: -50%; z-index: -2; pointer-events: none;
    background-image:
      linear-gradient(rgba(20,19,52,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(20,19,52,0.05) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridMove 12s linear infinite;
  }
  @keyframes gridMove {
    from { transform: translate3d(0,0,0); }
    to   { transform: translate3d(60px,60px,0); }
  }

  /* ══════════════════════════════════════════
     Animated Skill Background
     Skill icon glyphs + rings behind the cards
     ══════════════════════════════════════════ */
  .skill-bg {
    position: fixed; inset: 0; z-index: -1;
    overflow: hidden; pointer-events: none;
  }

  /* Large translucent icon glyphs, slower and further back */
  .sb-glyph {
    position: absolute;
    opacity: 0;
    will-change: transform, opacity;
    animation-name: sbFloatGlyph;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes sbFloatGlyph {
    0%   { transform: translate3d(0,0,0) rotate(0deg) scale(1); opacity: 0; }
    15%  { opacity: 0.16; }
    50%  { transform: translate3d(60px,-70px,0) rotate(18deg) scale(1.15); opacity: 0.22; }
    85%  { opacity: 0.16; }
    100% { transform: translate3d(0,0,0) rotate(0deg) scale(1); opacity: 0; }
  }

  /* Expanding rings that pulse out from behind the card */
  .sb-ring {
    position: absolute; border-radius: 50%;
    border: 2px solid currentColor;
    opacity: 0;
    animation: sbRing 9s ease-out infinite;
  }
  @keyframes sbRing {
    0%   { transform: scale(0.2); opacity: 0; }
    18%  { opacity: 0.3; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sb-glyph, .sb-ring, .blob, .bg-grid, .bg-animated { animation: none; }
    .sb-glyph { opacity: 0.16; }
  }

  /* ── Noise Overlay ── */
  .noise-overlay {
    position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.02;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* ── Canvas ── */
  #particle-canvas {
    position: fixed; inset: 0; z-index: 0;
  }

  /* ── Progress Bar ── */
  .progress-bar {
    position: fixed; top: 0; left: 0; z-index: 100;
    height: 4px;
    background: linear-gradient(90deg, var(--cyan), var(--lime), var(--amber), var(--rose));
    box-shadow: 0 1px 10px rgba(0,153,184,0.45);
    transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    border-radius: 0 2px 2px 0;
  }

  /* ── Card Counter ── */
  .card-counter {
    position: fixed; top: 24px; right: 32px; z-index: 100;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; color: var(--slate);
    display: flex; align-items: baseline; gap: 4px;
    opacity: 0; transition: opacity 0.6s;
  }
  .card-counter.visible { opacity: 1; }
  .card-counter .current { color: var(--cyan); font-size: 18px; font-weight: 700; }
  .card-counter { font-weight: 600; }

  /* ── Cards Container ── */
  .cards-container {
    position: fixed; inset: 0; z-index: 1;
    overflow: hidden;
  }

  /* ── Single Card ── */
  .card {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 32px;
    transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform, opacity;
  }

  /* Cards enter from the RIGHT and exit to the LEFT */
  .card.above     { transform: translateX(-110%) rotateY(12deg) scale(0.9); opacity: 0; pointer-events: none; }
  .card.current   { transform: translateX(0) rotateY(0deg) scale(1); opacity: 1; pointer-events: auto; }
  .card.below     { transform: translateX(110%) rotateY(-12deg) scale(0.9); opacity: 0; pointer-events: none; }
  .card.exit-up   { transform: translateX(-110%) rotateY(12deg) scale(0.9); opacity: 0; pointer-events: none; }
  .card.exit-down { transform: translateX(110%) rotateY(-12deg) scale(0.9); opacity: 0; pointer-events: none; }

  .card-inner {
    width: 100%; max-width: 900px; max-height: 85vh;
    background: var(--card-surface);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px;
    /* overflow-x must be explicit: with only overflow-y set, the other axis
       computes to auto and the decorative glows (positioned outside the box)
       make the card scroll sideways into empty space. */
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    overflow-wrap: break-word;
    position: relative;
    box-shadow: 0 30px 70px -28px rgba(20,19,52,0.28),
                0 10px 30px -18px rgba(0,153,184,0.18),
                inset 0 1px 0 rgba(255,255,255,0.9);
  }

  /* Animated accent ring on the active card */
  .card.current .card-inner {
    animation: cardRing 8s ease-in-out infinite;
  }
  @keyframes cardRing {
    0%, 100% { border-color: rgba(0,153,184,0.45);  box-shadow: 0 30px 70px -28px rgba(20,19,52,0.28), 0 10px 34px -16px rgba(0,153,184,0.35),  inset 0 1px 0 rgba(255,255,255,0.9); }
    33%      { border-color: rgba(224,27,111,0.45); box-shadow: 0 30px 70px -28px rgba(20,19,52,0.28), 0 10px 34px -16px rgba(224,27,111,0.32), inset 0 1px 0 rgba(255,255,255,0.9); }
    66%      { border-color: rgba(90,158,0,0.45);   box-shadow: 0 30px 70px -28px rgba(20,19,52,0.28), 0 10px 34px -16px rgba(90,158,0,0.32),   inset 0 1px 0 rgba(255,255,255,0.9); }
  }

  /* Scrollable, but the scrollbar itself is hidden */
  .card-inner::-webkit-scrollbar { width: 0; height: 0; display: none; }
  .card-inner {
    scrollbar-width: none;        /* Firefox */
    -ms-overflow-style: none;     /* legacy Edge/IE */
  }

  /* ── Card Glow ── */
  .card-glow {
    position: absolute; width: 300px; height: 300px; border-radius: 50%;
    filter: blur(100px); opacity: 0.18; pointer-events: none; z-index: -1;
    animation: glowPulse 6s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { transform: scale(1); opacity: 0.14; }
    50% { transform: scale(1.25); opacity: 0.24; }
  }

  /* ── Card Number ── */
  .card-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 120px; font-weight: 800;
    position: absolute; top: -20px; right: 24px;
    opacity: 0.22; line-height: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,153,184,0.85), rgba(224,27,111,0.08));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── Card Icon ── */
  .card-icon {
    width: 56px; height: 56px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; margin-bottom: 24px;
    position: relative; overflow: hidden;
    border: 1px solid rgba(20,19,52,0.08);
    box-shadow: 0 10px 24px -10px currentColor;
    animation: iconFloat 4s ease-in-out infinite;
  }
  @keyframes iconFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(-4deg); }
  }
  .card-icon::after {
    content: ''; position: absolute; inset: 0;
    background: inherit; opacity: 0.15;
  }

  /* ── Card Title ── */
  .card-title {
    font-size: 28px; font-weight: 700; letter-spacing: -0.03em;
    margin-bottom: 8px; line-height: 1.2;
  }

  /* ── Card Subtitle ── */
  .card-subtitle {
    font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 24px; opacity: 1; font-weight: 700; color: var(--lime);
  }

  /* ── Card Description ── */
  .card-desc {
    font-size: 15px; line-height: 1.75; color: var(--ink-soft);
    margin-bottom: 28px; max-width: 600px;
  }
  .card-desc strong {
    color: var(--cyan); font-weight: 800;
  }

  /* ── Tags ── */
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  .tag {
    padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: rgba(20,19,52,0.04); border: 1px solid rgba(20,19,52,0.12);
    color: var(--ink-soft); letter-spacing: 0.02em;
    transition: all 0.3s;
  }
  .tag:hover {
    background: linear-gradient(90deg, rgba(0,153,184,0.14), rgba(224,27,111,0.14));
    border-color: rgba(0,153,184,0.45);
    color: var(--ink); transform: translateY(-2px);
    box-shadow: 0 6px 16px -8px rgba(0,153,184,0.6);
  }

  /* ── Closing Note ── */
  .card-footer-note {
    margin-top: 20px; padding: 14px 18px;
    border-left: 3px solid var(--cyan);
    border-radius: 0 12px 12px 0;
    background: linear-gradient(90deg, rgba(0,153,184,0.10), rgba(0,153,184,0));
    font-size: 14px; line-height: 1.7; color: var(--ink-soft);
  }

  /* ── List Label ── */
  .list-label {
    font-size: 12px; font-weight: 800; letter-spacing: 2.5px;
    text-transform: uppercase; margin: 22px 0 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .list-label::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, currentColor, transparent);
    opacity: 0.5;
  }

  /* ── Project List ── */
  .project-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
  .project-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; border-radius: 12px;
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(20,19,52,0.09);
    transition: all 0.3s; cursor: default;
  }
  .project-item:hover {
    background: linear-gradient(90deg, rgba(0,153,184,0.10), rgba(224,27,111,0.07));
    border-color: rgba(0,153,184,0.4);
    transform: translateX(-8px);
    box-shadow: -6px 6px 18px -10px rgba(0,153,184,0.7);
  }
  .project-item .pi-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(20,19,52,0.04);
  }
  .project-item .pi-text {
    font-size: 14px; color: var(--ink); font-weight: 500;
  }
  .project-item .pi-badge {
    margin-left: auto; font-size: 10px; padding: 3px 10px;
    border-radius: 6px; background: rgba(20,19,52,0.06);
    color: var(--slate); font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase; flex-shrink: 0;
  }

  /* ── Key Work Items ── */
  .key-works { display: flex; flex-direction: column; gap: 10px; }
  .key-work {
    display: flex; align-items: flex-start; gap: 12px;
    font-size: 14px; color: var(--ink-soft); line-height: 1.6;
  }
  .key-work i { margin-top: 4px; font-size: 10px; flex-shrink: 0; }

  /* ── Stat Row ── */
  .stat-row { display: flex; gap: 24px; margin-bottom: 28px; flex-wrap: wrap; }
  .stat {
    display: flex; flex-direction: column; gap: 4px;
  }
  .stat-value {
    font-size: 32px; font-weight: 800; letter-spacing: -0.04em;
    line-height: 1;
  }
  .stat-label { font-size: 11px; color: var(--slate); text-transform: uppercase; letter-spacing: 1.5px; }

  /* ── Scroll Arrow ── */
  .scroll-arrow {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: none;
  }
  .scroll-arrow.visible { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
  .scroll-arrow i { color: var(--slate); font-size: 18px; animation: arrowBounce 1.5s ease-in-out infinite; }
  .scroll-arrow span { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--slate); }

  @keyframes arrowBounce {
    0%, 100% { transform: translateY(0); opacity: 0.4; }
    50% { transform: translateY(6px); opacity: 1; }
  }

  /* ══════════════════════════════════════════
     Intro Card — creative name treatment
     ══════════════════════════════════════════ */

  /* Small monospace kicker above the name */
  .intro-kicker {
    display: flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 4px; text-transform: uppercase;
    color: var(--slate); margin-bottom: 12px;
    opacity: 0; animation: fadeUp 0.7s 0.1s ease-out forwards;
  }
  .intro-kicker .ik-line {
    width: 26px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--rose));
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .intro-name {
    display: flex; flex-wrap: wrap; align-items: baseline;
    gap: 0 16px;
    font-size: 46px; font-weight: 900;
    letter-spacing: -0.035em; line-height: 1.02;
    margin-bottom: 12px;
  }

  .n-word { display: inline-flex; }

  /* Each letter drops into place in sequence */
  .n-ch {
    display: inline-block;
    opacity: 0;
    animation: chIn 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes chIn {
    from { opacity: 0; transform: translateY(0.45em) rotate(7deg) scale(0.88); }
    to   { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  }

  /* First name: each letter takes the next accent colour.
     Done per letter rather than with background-clip:text, because a
     gradient clipped on the parent can drop out when children animate
     their transform. */
  .n-first .n-ch                  { color: var(--cyan); }
  .n-first .n-ch:nth-child(6n+2)  { color: var(--violet); }
  .n-first .n-ch:nth-child(6n+3)  { color: var(--rose); }
  .n-first .n-ch:nth-child(6n+4)  { color: var(--amber); }
  .n-first .n-ch:nth-child(6n+5)  { color: var(--emerald); }
  .n-first .n-ch:nth-child(6n+6)  { color: var(--indigo); }

  /* Surname: hollow outline, so the two halves contrast */
  .n-last {
    -webkit-text-stroke: 1.8px var(--ink);
    -webkit-text-fill-color: transparent;
    color: transparent;
    letter-spacing: -0.02em;
  }

  /* Accent bar that draws itself in under the name */
  .intro-rule {
    --rule-w: 132px;
    height: 5px; width: 0; border-radius: 99px; margin-bottom: 16px;
    background: linear-gradient(90deg, var(--cyan), var(--rose), var(--amber));
    animation: ruleIn 0.9s 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes ruleIn { to { width: var(--rule-w); } }

  @media (prefers-reduced-motion: reduce) {
    .n-ch, .intro-kicker { animation: none; opacity: 1; }
    .intro-rule { animation: none; width: var(--rule-w); }
  }
  .intro-role {
    font-size: 16px; font-weight: 700; color: var(--cyan);
    margin-bottom: 28px; letter-spacing: 0.02em;
  }

  .skill-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px; margin-top: 20px;
  }
  .skill-chip {
    padding: 10px 14px; border-radius: 12px;
    background: rgba(255,255,255,0.8); border: 1px solid rgba(20,19,52,0.10);
    font-size: 12px; font-weight: 600; color: var(--ink);
    display: flex; align-items: center; gap: 8px;
    transition: all 0.3s;
  }
  .skill-chip:hover {
    background: linear-gradient(135deg, rgba(0,153,184,0.14), rgba(224,27,111,0.14));
    border-color: rgba(0,153,184,0.4);
    transform: translateY(-4px) scale(1.04);
    box-shadow: 0 12px 22px -12px rgba(0,153,184,0.8);
  }
  .skill-chip i { font-size: 14px; }

  /* ══════════════════════════════════════════
     RESPONSIVE
     ══════════════════════════════════════════ */

  /* ── Tablet / small laptop ── */
  @media (max-width: 1024px) {
    .card { padding: 32px 24px; }
    .card-inner { padding: 38px 32px; max-height: 88vh; }
    .card-title { font-size: 25px; }
    .intro-name { font-size: 38px; }
  }

  /* ── Mobile: the card becomes the whole page ── */
  @media (max-width: 768px) {
    /* Card fills the viewport edge to edge */
    .card { padding: 0; align-items: stretch; }
    .card-inner {
      width: 100%; max-width: none;
      height: 100%; max-height: none;
      border-radius: 0;
      border-left: none; border-right: none;
      background: rgba(255,255,255,0.86);
      /* room for the status bar / notch up top and the dot bar below */
      padding: calc(env(safe-area-inset-top, 0px) + 54px)
               20px
               calc(env(safe-area-inset-bottom, 0px) + 32px)
               20px;
      box-shadow: none;
      -webkit-overflow-scrolling: touch;
    }
    /* The animated ring reads as a flicker at full bleed, so drop it */
    .card.current .card-inner { animation: none; border-color: transparent; }

    /* Slide fully off-screen: no gap at the edges */
    .card.above, .card.exit-up     { transform: translateX(-100%) scale(1); }
    .card.below, .card.exit-down   { transform: translateX(100%) scale(1); }
    .card.current                  { transform: translateX(0) scale(1); }

    /* Type scale */
    .card-title { font-size: 23px; }
    .card-subtitle { font-size: 11px; letter-spacing: 1.6px; margin-bottom: 20px; }
    .card-desc { font-size: 14.5px; line-height: 1.7; max-width: none; }

/**
 * Splits a name into per-letter spans so each character can drop in
 * on its own beat. First word gets the gradient fill, the rest are
 * rendered as hollow outlines.
 */
function creativeName(full) {
  const words = String(full).trim().split(/\s+/);
  let n = 0;
  return words.map((word, wi) => {
    const cls = wi === 0 ? 'n-word n-first' : 'n-word n-last';
    const letters = Array.from(word).map(ch => {
      const delay = (0.18 + n * 0.045).toFixed(3);
      n++;
      return `<span class="n-ch" style="animation-delay:${delay}s">${ch}</span>`;
    }).join('');
    return `<span class="${cls}">${letters}</span>`;
  }).join('');
}

    content += '</div>';
  }

  el.innerHTML = `<div class="card-inner">${content}</div>`;
  container.appendChild(el);
});

document.getElementById('counterTotal').textContent = String(cards.length).padStart(2, '0');

// ── Card Navigation ──
let currentIndex = 0;
let isAnimating = false;

function goToCard(index) {
  if (isAnimating || index === currentIndex || index < 0 || index >= cards.length) return;
  isAnimating = true;

  const direction = index > currentIndex ? 'up' : 'down';
  const allCards = container.querySelectorAll('.card');

  // Current card exits
  allCards[currentIndex].className = `card ${direction === 'up' ? 'exit-up' : 'exit-down'}`;

  // New card enters
  allCards[index].className = 'card current';

  // Other cards
  allCards.forEach((c, i) => {
    if (i !== index && i !== currentIndex) {
      c.className = `card ${i < index ? 'above' : 'below'}`;
    }
  });

  currentIndex = index;

  // Reset the incoming card to the top
  const inner = allCards[index].querySelector('.card-inner');
  if (inner) inner.scrollTop = 0;

  updateUI();

  setTimeout(() => { isAnimating = false; updateUI(); }, 800);
}

function nextCard() { goToCard(currentIndex + 1); }
function prevCard() { goToCard(currentIndex - 1); }

/* ──────────────────────────────────────────────
   Where the pointer is decides what the wheel does:
     over the card    -> scroll the card vertically
     outside the card -> move between cards
   ────────────────────────────────────────────── */
const EDGE_TOLERANCE = 4;   // px slack when testing top/bottom

function currentInner() {
  const card = container.querySelectorAll('.card')[currentIndex];
  return card ? card.querySelector('.card-inner') : null;
}
function isScrollable(inner) {
  return !!inner && inner.scrollHeight - inner.clientHeight > EDGE_TOLERANCE;
}
function atBottom(inner) {
  return inner.scrollTop + inner.clientHeight >= inner.scrollHeight - EDGE_TOLERANCE;
}
function atTop(inner) {
  return inner.scrollTop <= EDGE_TOLERANCE;
}

/** True when the event happened over the card surface. */
function isOverCard(e) {
  return !!(e.target.closest && e.target.closest('.card-inner'));
}

function updateUI() {
  // Progress
  const progress = ((currentIndex + 1) / cards.length) * 100;
  document.getElementById('progressBar').style.width = progress + '%';

  // Counter
  document.getElementById('counterCurrent').textContent = String(currentIndex + 1).padStart(2, '0');
}

// ── Touch / Swipe ──
let touchStartY = 0;
let touchStartX = 0;
let touchStartTime = 0;

document.addEventListener('touchstart', (e) => {
  touchStartY = e.touches[0].clientY;
  touchStartX = e.touches[0].clientX;
  touchStartTime = Date.now();
}, { passive: true });

document.addEventListener('touchend', (e) => {
  const deltaX = touchStartX - e.changedTouches[0].clientX;
  const deltaY = touchStartY - e.changedTouches[0].clientY;
  const elapsed = Date.now() - touchStartTime;

  // Horizontal swipe always navigates. Drag left -> next card slides in from the right.
  if (Math.abs(deltaX) > 50 && Math.abs(deltaY) < Math.abs(deltaX) && elapsed < 600) {
    if (deltaX > 0) nextCard();
    else prevCard();
    return;
  }

  // Vertical swipe over the card just scrolls it (handled natively).
  // Outside the card, a vertical swipe also changes card.
  if (Math.abs(deltaY) > 60 && elapsed < 600 && !isOverCard(e)) {
    if (deltaY > 0) nextCard();
    else prevCard();
  }
}, { passive: true });

/* ── Mouse Wheel ──
   One gesture moves exactly one card.

   A single trackpad flick or wheel spin fires a long stream of wheel
   events. A simple time lock is not enough: as soon as it expires the
   still-arriving events advance the next card, and the deck appears to
   swipe by itself. So instead of timing the cards, we detect where one
   gesture ends — a pause in the event stream — and allow only the first
   event of each gesture to navigate. */
const GESTURE_GAP_MS = 220;   // quiet period that marks the end of a gesture

let lastWheelAt = 0;
let gestureUsed = false;

document.addEventListener('wheel', (e) => {
  // Pointer over the card: leave it alone, the card scrolls natively.
  if (isOverCard(e)) return;

  const now = Date.now();
  // A long enough pause means the previous gesture finished and this is a new one.
  if (now - lastWheelAt > GESTURE_GAP_MS) gestureUsed = false;
  lastWheelAt = now;

  // Already moved a card for this gesture: ignore the rest of its momentum.
  if (gestureUsed) return;

  const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (Math.abs(delta) < 15) return;

  gestureUsed = true;
  if (delta > 0) nextCard(); else prevCard();
}, { passive: true });

// Keep the hint in sync while the card content is being scrolled
container.addEventListener('scroll', (e) => {
  if (e.target.classList && e.target.classList.contains('card-inner')) updateUI();
}, true);

// ── Keyboard ──
document.addEventListener('keydown', (e) => {
  const inner = currentInner();

  // Left/Right arrows always change card.
  // e.repeat guards against a held key marching through the deck.
  if (e.key === 'ArrowRight') { e.preventDefault(); if (!e.repeat) nextCard(); return; }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); if (!e.repeat) prevCard(); return; }

  // Down/Up/Space scroll the card first, then move on
  if (e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
    e.preventDefault();
    if (isScrollable(inner) && !atBottom(inner)) {
      inner.scrollBy({ top: e.key === 'ArrowDown' ? 120 : inner.clientHeight * 0.85, behavior: 'smooth' });
      return;
    }
    nextCard();
    return;
  }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') {
    e.preventDefault();
    if (isScrollable(inner) && !atTop(inner)) {
      inner.scrollBy({ top: e.key === 'ArrowUp' ? -120 : -inner.clientHeight * 0.85, behavior: 'smooth' });
      return;
    }
    prevCard();
    return;
  }
});

/* ══════════════════════════════════════════════
   Animated Skill Background
   Oversized skill icon glyphs and pulsing accent
   rings, floating gently behind the cards.
   ══════════════════════════════════════════════ */
const SKILL_BG = [
  { label: 'Web Development',   icon: 'fas fa-code',         color: 'var(--cyan)' },
  { label: 'UI/UX Design',      icon: 'fas fa-pen-nib',      color: 'var(--violet)' },
  { label: 'Graphic Design',    icon: 'fas fa-palette',      color: 'var(--rose)' },
  { label: 'Video Editing',     icon: 'fas fa-film',         color: 'var(--orange)' },
  { label: 'Photography',       icon: 'fas fa-camera',       color: 'var(--amber)' },
  { label: 'Motion Graphics',   icon: 'fas fa-wand-magic-sparkles', color: 'var(--indigo)' },
  { label: 'Social Media',      icon: 'fas fa-share-nodes',  color: 'var(--emerald)' },
  { label: 'AI Automation',     icon: 'fas fa-robot',        color: 'var(--lime)' },
  { label: 'QA Testing',        icon: 'fas fa-bug',          color: 'var(--blue)' },
  { label: 'Data Analysis',     icon: 'fas fa-chart-bar',    color: 'var(--violet)' },
  { label: 'Printing Solutions',icon: 'fas fa-print',        color: 'var(--amber)' },
  { label: 'VFX',               icon: 'fas fa-clapperboard', color: 'var(--rose)' },
  { label: 'Wireframing',       icon: 'fas fa-vector-square',color: 'var(--cyan)' },
  { label: 'Workflow Tools',    icon: 'fas fa-gears',        color: 'var(--emerald)' },
];

const skillBg = document.getElementById('skillBg');

function buildSkillBackground() {
  if (!skillBg) return;
  skillBg.innerHTML = '';

  const narrow = window.innerWidth < 768;
  const glyphCount = narrow ? 5 : 9;
  const ringCount  = narrow ? 2 : 4;

  // Oversized translucent glyphs, slow float in place
  for (let i = 0; i < glyphCount; i++) {
    const s = SKILL_BG[Math.floor(Math.random() * SKILL_BG.length)];
    const g = document.createElement('i');
    g.className = `${s.icon} sb-glyph`;
    g.style.color = s.color;
    g.style.left = (Math.random() * 88) + '%';
    g.style.top = (Math.random() * 82) + '%';
    g.style.fontSize = (60 + Math.random() * 90).toFixed(0) + 'px';
    g.style.animationDuration = (16 + Math.random() * 14).toFixed(1) + 's';
    g.style.animationDelay = '-' + (Math.random() * 20).toFixed(1) + 's';
    skillBg.appendChild(g);
  }

  // Pulsing accent rings
  const ringColors = ['var(--cyan)', 'var(--rose)', 'var(--lime)', 'var(--amber)'];
  for (let i = 0; i < ringCount; i++) {
    const r = document.createElement('div');
    r.className = 'sb-ring';
    const size = 200 + Math.random() * 260;
    r.style.width = size + 'px';
    r.style.height = size + 'px';
    r.style.color = ringColors[i % ringColors.length];
    r.style.left = (Math.random() * 80) + '%';
    r.style.top = (Math.random() * 75) + '%';
    r.style.animationDelay = '-' + (Math.random() * 9).toFixed(1) + 's';
    skillBg.appendChild(r);
  }
}

buildSkillBackground();

// Rebuild on resize so the glyph placement stays spread out
let sbResize;
window.addEventListener('resize', () => {
  clearTimeout(sbResize);
  sbResize = setTimeout(buildSkillBackground, 400);
});

// ── Particle Canvas ──
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); updateUI(); });

const PARTICLE_COLORS = [
  '0,153,184', '224,27,111', '90,158,0', '217,131,0', '124,58,237', '4,145,106'
];

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2.2 + 0.6;
    this.speedX = (Math.random() - 0.5) * 0.5;
    this.speedY = (Math.random() - 0.5) * 0.5;
    this.opacity = Math.random() * 0.35 + 0.12;
    this.color = PARTICLE_COLORS[Math.floor(Math.random() * PARTICLE_COLORS.length)];
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`;
    ctx.fill();
  }
}

for (let i = 0; i < 60; i++) particles.push(new Particle());

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });

  // Draw connections
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 120) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(${particles[i].color}, ${0.14 * (1 - dist / 120)})`;
        ctx.lineWidth = 0.7;
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();

// ── Init ──
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('loader').classList.add('hidden');
    document.getElementById('cardCounter').classList.add('visible');
    updateUI();
  }, 800);
});
</script>
</body>
